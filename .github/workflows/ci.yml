name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify (Maven drives npm)
        run: mvn -B verify

      - name: Upload Spring Boot JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jyrion-server-jar
          path: server/target/jyrion-server-*.jar
          if-no-files-found: warn
